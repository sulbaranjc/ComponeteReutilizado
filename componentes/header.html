<header class="hero" role="banner">
  <!-- Enlace de salto a contenido -->
  <a class="hero-skip" href="#contenido">Saltar al contenido</a>

  <div class="hero-wrap">
    <!-- Logo -->
    <a class="hero-logo" href="index.html" aria-label="Ir al inicio">
      <!-- Puedes cambiar por una imagen <img> -->
      <span class="hero-logo-mark">◆</span>
    </a>

    <!-- Título / Nombre de la app -->
    <div class="hero-title" aria-label="Nombre de la aplicación">
      Mi Proyecto Web
    </div>

    <!-- Toggle responsive (sin JS, con checkbox-hack) -->
    <input type="checkbox" id="hero-menu-toggle" class="hero-toggle" aria-label="Abrir menú" />
    <label for="hero-menu-toggle" class="hero-burger" aria-hidden="true">☰</label>

    <!-- Navegación -->
    <nav class="hero-nav" aria-label="Navegación principal">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </div>
